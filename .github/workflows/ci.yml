name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-and-application:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.4'
          extensions: intl, mbstring, pdo_sqlite, zip
          coverage: none
          tools: composer:v2
      - name: Validate package metadata
        run: composer validate --strict
      - name: Prepare the consuming Symfony application
        run: python3 dev/run.py --native prepare
      - name: Check PHP and repository tools
        run: |
          git ls-files -z '*.php' | xargs -0 -r -n 1 php -l
          python3 -m py_compile dev/run.py tools/check-package.py
          python3 -m unittest discover -s dev/tests -p 'test_*.py'
          node --check tools/check-github-mentions.mjs
      - name: Check package behavior
        run: |
          if [ -d tests ]; then vendor/bin/phpunit; fi
          python3 tools/check-package.py
      - name: Check the consuming application
        run: python3 dev/run.py --native check

  prepared-environment:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Start the prepared development environment
        run: python3 dev/run.py up
      - name: Check the running application and native Symfony tools
        run: |
          python3 dev/run.py status
          python3 dev/run.py check
      - name: Verify Serena v2 sessions and recovery
        run: python3 dev/check-serena.py
      - name: Retain Serena verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: serena-evidence
          path: dev/.state/serena-evidence.json
          if-no-files-found: ignore
      - name: Stop this worktree's environment
        if: always()
        run: python3 dev/run.py down
